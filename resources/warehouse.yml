# Serverless SQL Warehouse for the analytics views, the Genie space and (Phase 5) the AI/BI
# dashboard (ADR-0003, NFR-3). It only runs while queried and stops after 5 idle minutes (NFR-4).
targets:
  dev:
    resources:
      sql_warehouses:
        hsl_analytics:
          name: hsl-live-transit-analytics
          cluster_size: 2X-Small
          enable_serverless_compute: true
          warehouse_type: PRO
          min_num_clusters: 1
          max_num_clusters: 1
          auto_stop_mins: 5
          tags:
            custom_tags:
              - key: project
                value: hsl_live_transit
